[project]
name = "dungeon-master-cortex"
version = "0.1.0"
description = "AD&D 2e character and dungeon master toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dmcortex = "dmcortex.app:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
