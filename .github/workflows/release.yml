name: Build And Publish Release

on:
  push:
    branches:
      - master
    paths:
      - 'DungeonMasterCortex/DungeonMasterCortex.csproj'
      - 'build-installers.ps1'
      - 'Installer/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read Version
        id: version
        shell: pwsh
        run: |
          [xml]$xml = Get-Content .\DungeonMasterCortex\DungeonMasterCortex.csproj
          $version = ($xml.Project.PropertyGroup.Version | Select-Object -First 1).Trim()
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'Could not determine version from DungeonMasterCortex.csproj.'
          }

          $tag = "v$version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Installers
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          $dmOut = 'artifacts/github-release/dm'
          $playerOut = 'artifacts/github-release/player'

          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_BASE64) -and -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_PASSWORD)) {
            New-Item -ItemType Directory -Path artifacts/signing -Force | Out-Null
            $certPath = 'artifacts/signing/codesign.pfx'
            [System.IO.File]::WriteAllBytes($certPath, [System.Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_BASE64))

            ./build-installers.ps1 `
              -DmInstallerOutputDir $dmOut `
              -PlayerInstallerOutputDir $playerOut `
              -SignInstallers `
              -SigningCertPath $certPath `
              -SigningCertPassword $env:WINDOWS_SIGNING_CERT_PASSWORD
          }
          else {
            ./build-installers.ps1 `
              -DmInstallerOutputDir $dmOut `
              -PlayerInstallerOutputDir $playerOut
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            artifacts/github-release/dm/DMCodex-Setup-*.exe
            artifacts/github-release/player/PlayerCodex-Setup-*.exe
          generate_release_notes: true
